<title id="diagram-title">EconOS dashboard and kernel deploy separately</title>
<desc id="diagram-desc">A push to main runs CI: gitleaks, pytest, and Playwright. When CI passes, a Vercel deploy hook builds the static dashboard. The shared kernel is updated by hand over SSH with git pull and docker compose up -d. The two meet only over a WebSocket from the dashboard to the kernel.</desc>

<text x="434" y="250" font-size="14" class="muted">Oracle Always Free host</text>
