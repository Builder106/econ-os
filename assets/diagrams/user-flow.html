<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>One kernel, two roles</title>
<style>:root{color-scheme:light;--bg:#f7f3e9;--ink:#141820;--muted:#4e5a55;--panel:#fcf9f1;--panel-alt:#e8f3eb;--line:#a9b9ad;--accent:#006b7a;--success:#0e7a2a;--warning:#b82a20;--mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;--sans:Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif}@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#0a0b0e;--ink:#f7faf8;--muted:#b1bdb8;--panel:#171b20;--panel-alt:#10282b;--line:#4c6162;--accent:#00f5ff;--success:#00ff41;--warning:#ff4136;}}html,body{margin:0;background:var(--bg)}body{font-family:var(--sans)}.figure-scroll{max-width:960px;margin:auto;overflow-x:auto}svg{display:block;width:100%;min-width:960px}@media print{.figure-scroll{overflow-x:visible}svg{min-width:0}}</style></head>
<body><div class="figure-scroll"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="figure-title figure-desc">
<title id="figure-title">One kernel, two roles</title><desc id="figure-desc">Viewer, admin and shared-kernel swimlanes. Invalid tokens keep users read-only. Valid Fed actions mutate the shared kernel; an ADMIN event reaches every viewer, and the kernel ticks every 500 milliseconds.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="var(--accent)" stroke-width="1.8"/></marker></defs>
<rect width="960" height="600" fill="var(--bg)"/>
<text x="40" y="67" font-size="30" fill="var(--ink)" font-weight="700">One kernel, two roles</text><path d="M40 94 H920" fill="none" stroke="var(--line)" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><rect x="40" y="114" width="880" height="130" rx="2" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/><text x="56" y="142" font-size="12" fill="var(--accent)" font-weight="700" font-family="var(--mono)">VIEWER</text><rect x="40" y="254" width="880" height="130" rx="2" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/><text x="56" y="282" font-size="12" fill="var(--accent)" font-weight="700" font-family="var(--mono)">ADMIN</text><rect x="40" y="394" width="880" height="130" rx="2" fill="var(--panel-alt)" stroke="var(--line)" stroke-width="1"/><text x="56" y="422" font-size="12" fill="var(--accent)" font-weight="700" font-family="var(--mono)">SHARED KERNEL</text><path d="M250 184 H356" fill="none" stroke="var(--accent)" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M684 443 H611 V207 H567" fill="none" stroke="var(--accent)" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M246 324 H355" fill="none" stroke="var(--accent)" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M560 324 H632 V456 H684" fill="none" stroke="var(--accent)" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M887 455 H903 V185 H887" fill="none" stroke="var(--accent)" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="95" y="155" width="155" height="64" rx="2" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/><text x="110" y="179" font-size="13" fill="var(--ink)" font-weight="700">Open dashboard</text><text x="110" y="200" font-size="11" fill="var(--muted)" font-weight="400">read-only by default</text><rect x="356" y="155" width="211" height="64" rx="2" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/><text x="372" y="179" font-size="15" fill="var(--ink)" font-weight="700">Monitor and explore</text><text x="372" y="200" font-size="11" fill="var(--muted)" font-weight="400" font-family="var(--mono)">help / inspect / top / gini</text><rect x="740" y="155" width="147" height="64" rx="2" fill="var(--panel-alt)" stroke="var(--accent)" stroke-width="1"/><text x="753" y="178" font-size="15" fill="var(--ink)" font-weight="700">All viewers</text><text x="753" y="199" font-size="11" fill="var(--muted)" font-weight="400">see ADMIN event</text><rect x="95" y="295" width="151" height="64" rx="2" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/><text x="110" y="319" font-size="10" fill="var(--ink)" font-weight="700" font-family="var(--mono)">sudo &lt;ADMIN_TOKEN&gt;</text><text x="110" y="340" font-size="10" fill="var(--warning)" font-weight="400">invalid → read-only</text><rect x="355" y="295" width="205" height="64" rx="2" fill="var(--panel)" stroke="var(--success)" stroke-width="1"/><text x="371" y="319" font-size="15" fill="var(--ink)" font-weight="700">Valid: Fed mode</text><text x="371" y="340" font-size="11" fill="var(--muted)" font-weight="400" font-family="var(--mono)">tax / shock / pause / reset</text><rect x="684" y="425" width="203" height="82" rx="2" fill="var(--panel-alt)" stroke="var(--accent)" stroke-width="1.5"/><text x="701" y="453" font-size="16" fill="var(--ink)" font-weight="700">Single live kernel</text><text x="701" y="476" font-size="12" fill="var(--success)" font-weight="400" font-family="var(--mono)">500 ms ticks</text><text x="701" y="494" font-size="11" fill="var(--muted)" font-weight="400">action changes shared state</text>
