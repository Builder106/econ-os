<style>
:root { color-scheme: light dark; --bg: #ffffff; --ink: #1f2328; --muted: #59636e; --edge: #59636e; --box: #8c959f; --group: #d1d9e0; --groupfill: #f6f8fa; --accent: #0969da; }
@media (prefers-color-scheme: dark) { :root { --bg: #0d1117; --ink: #f0f6fc; --muted: #9198a1; --edge: #9198a1; --box: #656c76; --group: #3d444d; --groupfill: #151b23; --accent: #4493f8; } }
html, body { margin: 0; background: var(--bg); }
main { max-width: 880px; margin: 0 auto; }
svg { display: block; width: 100%; height: auto; }
text { font-family: "IBM Plex Sans", system-ui, sans-serif; fill: var(--ink); }
.mono { font-family: "IBM Plex Mono", ui-monospace, monospace; }
.muted { fill: var(--muted); }
.accent-text { fill: var(--accent); }
.bg, .halo { fill: var(--bg); }
.node { fill: var(--bg); stroke-width: 1.25; }
.node.box { stroke: var(--box); }
.node.accent { stroke: var(--accent); stroke-width: 2; }
.group { fill: var(--groupfill); stroke: var(--group); }
.boundary { fill: none; stroke: var(--box); stroke-dasharray: 6 6; }
.edge { fill: none; stroke: var(--edge); stroke-width: 1.5; }
.edge.accent { stroke: var(--accent); stroke-width: 2; }
.edge.dashed { stroke-dasharray: 6 5; }
.lifeline { fill: none; stroke: var(--group); stroke-dasharray: 4 5; }
.tip { fill: var(--edge); }
.tip-accent { fill: var(--accent); }
</style>
</head>

<main>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 254" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">EconOS viewer and admin access</title>
<desc id="diagram-desc">Any viewer can run read-only commands such as help, gini, top, and inspect against the shared kernel. A session that runs sudo with the right token can also change it with tax, shock, pause, and reset. A wrong token leaves the session read-only. The kernel ticks every 500 ms and pushes ticks and admin events to every connected dashboard.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="tip" d="M0,0 L10,5 L0,10 Z"/></marker>
<marker id="arrow-accent" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="tip-accent" d="M0,0 L10,5 L0,10 Z"/></marker>
</defs>
<rect class="bg" width="880" height="254"/>
<rect class="node box" x="16" y="16" width="250" height="67" rx="6"/>
<text x="30" y="43" font-size="16" font-weight="600">Any viewer</text>
<text x="30" y="64" font-size="14" class="muted mono">help, gini, top, inspect</text>
<rect class="node box" x="16" y="150" width="250" height="88" rx="6"/>
<text x="30" y="177" font-size="16" font-weight="600">Admin session</text>
<text x="30" y="198" font-size="14" class="muted mono">sudo &lt;token&gt;</text>
<text x="30" y="219" font-size="14" class="muted mono">tax, shock, pause, reset</text>
<rect class="node accent" x="380" y="83" width="220" height="67" rx="6"/>
<text x="394" y="110" font-size="16" font-weight="600">Shared kernel</text>
<text x="394" y="131" font-size="14" class="muted">one tick every 500 ms</text>
<rect class="node box" x="680" y="83" width="184" height="67" rx="6"/>
<text x="694" y="110" font-size="16" font-weight="600">Every dashboard</text>
<text x="694" y="131" font-size="14" class="muted">ticks and events</text>
<path class="edge" d="M266,49.5 L323,49.5 L323,103.1 L380,103.1" marker-end="url(#arrow)"/>
<rect class="halo" x="270.9" y="29" width="47.2" height="19"/>
<text x="294.5" y="42" font-size="14" class="label" text-anchor="middle">reads</text>
<path class="edge" d="M266,194 L323,194 L323,129.9 L380,129.9" marker-end="url(#arrow)"/>
<rect class="halo" x="266.98" y="173" width="55.04" height="19"/>
<text x="294.5" y="186" font-size="14" class="label" text-anchor="middle">writes</text>
<path class="edge accent" d="M600,116.5 L680,116.5" marker-end="url(#arrow-accent)"/>
<rect class="halo" x="612.48" y="95.5" width="55.04" height="19"/>
<text x="640" y="108.5" font-size="14" class="label accent-text" text-anchor="middle">pushes</text>
</svg>
