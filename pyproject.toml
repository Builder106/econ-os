[project]
name = "econ-os"
version = "0.1.0"
description = "Multi-agent macroeconomic simulation kernel & interactive dashboard."
requires-python = ">=3.11"
dependencies = [
    "pettingzoo",
    "supersuit",
    "stable-baselines3",
    "torch",
    "gymnasium",
    "numpy",
    "pandas",
    "matplotlib",
    "httpx<0.29",
    "fastapi",
    "uvicorn[standard]",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-asyncio",
    "ruff",
    "httpx2",
]

[tool.uv]
package = false
default-groups = []

# The kernel runs PPO inference on CPU. On Linux, PyPI's torch wheel pulls
# about 4 GB of CUDA libraries, so take torch from the CPU index there.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["simulation/tests"]
asyncio_default_fixture_loop_scope = "function"
addopts = "--cov=simulation --cov=server --cov-report=term-missing --cov-report=xml --cov-fail-under=100"
filterwarnings = [
    "error",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# Select only the rule families that were passing before the ruff upgrade.
# Expand this list deliberately, not by upgrading ruff and hoping for the best.
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
    "ANN401", # Reject untyped function boundaries
]
ignore = [
    # B019: lru_cache on methods — PettingZoo's ParallelEnv API requires this pattern.
    "B019",
    # SIM117: collapse nested `with` blocks — nested form is clearer in test helpers.
    "SIM117",
    # RUF012: mutable class-variable default — metadata dict is intentional class-var.
    "RUF012",
    # BLE001: blind Exception catch — needed for graceful task-cancellation teardown.
    "BLE001",
    # S110: try-except-pass — deliberate in async stop() and PPO load fallback.
    "S110",
]

[tool.ruff.lint.isort]
known-first-party = ["server", "simulation"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
