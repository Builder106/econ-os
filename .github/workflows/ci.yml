name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel stale runs on the same branch to save CI minutes — useful when you
# push -f or land several commits in quick succession.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_NOTIFY_USER_LIST: ""

  commitlint:
    name: Commit message lint
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6

  pytest:
    name: pytest (env + commands) & build / license checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python deps
        run: uv sync --frozen --group dev

      - name: Python dependency audit
        run: uv run --with pip-audit pip-audit

      - name: License compliance check
        run: uv run --with pip-licenses pip-licenses --fail-on="AGPL;GPL"

      - name: Package build check
        run: uv build --no-sources || uv build

      - name: Lint with Ruff
        run: uv run --frozen ruff check server simulation

      - name: Format check with Ruff
        run: uv run --frozen ruff format --check server simulation

      - name: Run pytest with coverage
        env:
          PYTHONWARNINGS: "error"
        run: uv run --frozen pytest --cov=simulation --cov=server --cov-report=term-missing --cov-report=xml --cov-fail-under=100 -W error

  playwright:
    name: playwright (e2e dashboard)
    needs: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The Playwright config's webServer spawns uvicorn, so the e2e job
      # needs the Python deps too — not just Node + Chromium.
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python deps
        run: uv sync --frozen --group dev

      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install npm deps
        run: npm ci

      - name: Typecheck TypeScript
        run: npx tsc --noEmit

      - name: Node dependency audit
        run: npm audit --audit-level=high

      # Cache Playwright's downloaded Chromium binary across runs (~250 MB).
      # Key on package-lock so an upgrade busts the cache automatically.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright Chromium + system deps
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps only (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Generate Gherkin specs
        run: npx bddgen

      - name: Run Playwright
        run: npx playwright test

      # On failure, upload the report + raw test-results so you can download
      # and replay traces / videos locally to debug.
      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  deploy:
    name: Trigger Vercel Deploy
    needs: [secrets, commitlint, playwright]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
    runs-on: ubuntu-24.04
    steps:
      - name: Deploy to Staging
        if: github.ref == 'refs/heads/staging'
        env:
          HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_STAGING }}
        run: |
          if [ -z "$HOOK_URL" ]; then
            echo "VERCEL_DEPLOY_HOOK_STAGING is not set; skipping deploy hook trigger"
            exit 0
          fi
          curl -sS -f -X POST "$HOOK_URL"
      - name: Deploy to Production
        if: github.ref == 'refs/heads/main'
        env:
          HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_PROD }}
        run: |
          if [ -z "$HOOK_URL" ]; then
            echo "VERCEL_DEPLOY_HOOK_PROD is not set; skipping deploy hook trigger"
            exit 1
          fi
          curl -sS -f -X POST "$HOOK_URL"
