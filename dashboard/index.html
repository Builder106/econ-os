<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Resolve theme BEFORE first paint so there's no flash of the wrong colors.
         Persistence: localStorage 'econos.themePref' ∈ {dark, light, system}.
         Default: 'system' on first load — honor the OS preference. -->
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('econos.themePref') || 'system';
          var resolved = pref === 'system'
            ? (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
            : pref;
          document.documentElement.dataset.theme = resolved;
        } catch (_) { document.documentElement.dataset.theme = 'dark'; }
      })();
    </script>
    <!-- Pin background BEFORE Tailwind CDN loads to avoid the white flash
         visible in screen recordings and on very slow connections. -->
    <style>
      html[data-theme="dark"]  body { background: #0a0b0e; color: #fff; margin: 0; }
      html[data-theme="light"] body { background: #eef1f3; color: #17212a; margin: 0; }
    </style>
    <meta name="theme-color" content="#0a0b0e" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#eef1f3" media="(prefers-color-scheme: light)">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <title>EconOS | Economic Operating System</title>
    <meta name="description" content="A live multi-agent reinforcement-learning economic simulation, running as a shared mainframe. Twelve RL agents trading continuously — same simulation every visitor sees.">

    <!-- Open Graph (Discord, Slack, LinkedIn, iMessage, Facebook, etc.) -->
    <meta property="og:title" content="EconOS — Economic Operating System">
    <meta property="og:description" content="A live multi-agent RL economy running as a shared mainframe. 12 agents · PettingZoo + PPO · WebSocket fan-out.">
    <meta property="og:image" content="https://econ-os.vercel.app/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:alt" content="EconOS — large cyan EconOS wordmark beside a live wage/price chart on a dark glassmorphic background.">
    <meta property="og:url" content="https://econ-os.vercel.app">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="EconOS">

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="EconOS — Economic Operating System">
    <meta name="twitter:description" content="A live multi-agent RL economy running as a shared mainframe. 12 agents · PettingZoo + PPO · WebSocket fan-out.">
    <meta name="twitter:image" content="https://econ-os.vercel.app/og-image.png">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <link rel="stylesheet" href="styles.css">
    <!-- Kernel URL config (regenerated at deploy time from ECONOS_KERNEL_WS_URL env var). -->
    <script src="config.js"></script>
    <!-- Vercel Analytics (vanilla-JS / static path). The /_vercel/insights/* route is
         auto-served by Vercel's edge for any deployed project; no package install needed. -->
    <script>
      window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
    <a class="skip-link" href="#window-layer">Skip to live economy</a>
    <div id="desktop">
        <header id="desk-header">
            <button type="button" id="launcher-toggle" aria-expanded="false" aria-controls="desktop-icons"><i class="ph ph-squares-four" aria-hidden="true"></i> Apps</button>
            <h1>EconOS</h1>
            <span>One shared economy</span>
        </header>

        <nav id="desktop-icons" aria-label="App launcher" hidden>
            <button type="button" class="desktop-icon" onclick="launchWindow('macro-monitor')" data-tip="Live wage, price, inequality and liquidity"><i class="ph ph-chart-line-up" aria-hidden="true"></i><span>Market</span></button>
            <button type="button" class="desktop-icon" onclick="launchWindow('process-explorer')" data-tip="Balances and rewards for all twelve agents"><i class="ph ph-users-three" aria-hidden="true"></i><span>Agents</span></button>
            <button type="button" class="desktop-icon" onclick="launchWindow('econ-shell')" data-tip="Inspect the economy or enter Fed mode"><i class="ph ph-terminal-window" aria-hidden="true"></i><span>Shell</span></button>
            <button type="button" class="desktop-icon" onclick="launchWindow('policy-manager')" data-tip="Tax and market controls require Fed mode"><i class="ph ph-sliders-horizontal" aria-hidden="true"></i><span>Policy</span></button>
            <button type="button" class="desktop-icon" onclick="launchWindow('about')"><i class="ph ph-question" aria-hidden="true"></i><span>Guide</span></button>
            <button type="button" class="desktop-icon" onclick="startTour()" data-tip="Guided walkthrough of the economy"><i class="ph ph-compass" aria-hidden="true"></i><span>Tour</span></button>
        </nav>

        <main id="window-layer" tabindex="-1" aria-label="Live economy"></main>

        <footer id="taskbar">
            <div id="running-apps" aria-label="Running apps"></div>
            <div id="task-meta" aria-label="Kernel status">
                <span id="sys-time">--:--:--</span>
            </div>
            <button type="button" class="task-icon" id="theme-toggle" onclick="cycleTheme()" aria-label="Change color theme" data-tip="Theme: cycles dark / light / system"><i class="ph ph-moon" aria-hidden="true"></i></button>
        </footer>
    </div>

    <script src="main.js"></script>
</body>
</html>
